<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIT Inbox Monitor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <h1><span class="dot dot-cyan"></span> KRIT <span class="muted">/ inbox monitor</span></h1>
</header>

<main class="container">

    <section class="level-container">
        <div class="level"><span class="dot dot-critical"></span>Critical<strong>2</strong></div>
        <div class="level"><span class="dot dot-high"></span>High<strong>1</strong></div>
        <div class="level"><span class="dot dot-medium"></span>Medium<strong>1</strong></div>
        <div class="level"><span class="dot dot-low"></span>Low<strong>2</strong></div>
    </section>

    <section class="toolbar">
        <input type="search" id="search" placeholder="Search sender or subject">
    </section>

    <div class="layout">

        <!-- LEFT: table + log -->
        <section class="list-col">
            <table class="email-table">
                <thead>
                    <tr>
                        <th>Score</th>
                        <th>From</th>
                        <th>Subject</th>
                        <th>Received</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="email-body"></tbody>
            </table>

        </section>

        <!-- RIGHT: detail panel -->
        <aside class="detail-panel">
            <div class="detail-header" id="detail-header">
                <div>
                    <span class="detail-label" id="d-label"></span>
                    <p class="detail-subject" id="d-subject"></p>
                    <span class="detail-sender" id="d-sender"></span>
                </div>
                <span class="detail-score" id="d-score"></span>
            </div>

            <h4 class="evidence-title" id="d-evidence-title"></h4>
            <ul class="evidence-list" id="d-evidence"></ul>

            <button class="btn btn-primary">View full email content</button>
            <button class="btn">Draft notification to recipient</button>
        </aside>

    </div>
</main>

<script>
const emails = [
  { score: 94, level: "critical", sender: "security-alert@paypal-verify.com", subject: "Urgent: Your account will be suspended in 24 hours", time: "09:14", status: "✓ Notified",
    evidence: [
      ["DMARC authentication failed", 20],
      ["Urgency language detected", 15],
      ["Sender domain mimics paypal.com", 15],
      ["URL redirects through 4 domains", 15],
      ["XGBoost: high phishing probability", 15],
      ["Visual match to PayPal login (94%)", 20],
      ["OCR detected credential form", 10]
    ]},
  { score: 88, level: "critical", sender: "it-support@internal-helpdesk.com", subject: "Password expiry notice - reset within 12h", time: "Aug 21", status: "✓ Notified",
    evidence: [
      ["Sender domain not in allowlist", 25],
      ["Urgency language detected", 15],
      ["Link text does not match destination", 25],
      ["XGBoost: high phishing probability", 23]
    ]},
  { score: 71, level: "high", sender: "hr@company-benefits-update.net", subject: "Action required: Confirm your benefits enrollment", time: "08:47", status: "",
    evidence: [
      ["Lookalike domain of internal HR", 25],
      ["Action-required language", 15],
      ["XGBoost: elevated phishing probability", 31]
    ]},
  { score: 52, level: "medium", sender: "invoices@vendor-billing-portal.com", subject: "Invoice #48213 overdue - payment required", time: "Aug 21", status: "",
    evidence: [
      ["Unknown sender", 20],
      ["Payment urgency detected", 17],
      ["Attachment type: HTML", 15]
    ]},
  { score: 8, level: "low", sender: "notifications@github.com", subject: "[GitHub] New sign-in to your account", time: "07:30", status: "",
    evidence: [["SPF/DKIM/DMARC pass", 0], ["Known sender", 8]] },
  { score: 3, level: "low", sender: "newsletter@techweekly.io", subject: "This week in tech: 5 stories worth your time", time: "Aug 21", status: "",
    evidence: [["Bulk mail headers present", 3]] }
];

const levelLabel = { critical: "CRITICAL RISK", high: "HIGH RISK", medium: "MEDIUM RISK", low: "LOW RISK" };
const body = document.getElementById("email-body");
let selected = null;

function renderTable() {
  const q = document.getElementById("search").value.toLowerCase();
  const rows = emails
    .filter(e => e.sender.toLowerCase().includes(q) || e.subject.toLowerCase().includes(q))
    .sort((a, b) => b.score - a.score);

  body.innerHTML = "";
  rows.forEach(e => {
    const tr = document.createElement("tr");
    if (e === selected) tr.classList.add("selected");
    tr.innerHTML = `
      <td class="score score-${e.level}"><span class="dot dot-${e.level}"></span>${e.score}</td>
      <td class="sender">${e.sender}</td>
      <td class="subject">${e.subject}</td>
      <td class="time">${e.time}</td>
      <td class="status">${e.status}</td>`;
    tr.addEventListener("click", () => showDetail(e));
    body.appendChild(tr);
  });
}

function showDetail(e) {
  selected = e;
  document.getElementById("detail-header").className = "detail-header " + e.level;
  document.getElementById("d-label").textContent = levelLabel[e.level];
  document.getElementById("d-subject").textContent = e.subject;
  document.getElementById("d-sender").textContent = e.sender;
  document.getElementById("d-score").textContent = e.score;
  document.getElementById("d-evidence-title").textContent = `EVIDENCE (${e.evidence.length})`;
  document.getElementById("d-evidence").innerHTML = e.evidence
    .map(([text, pts]) => `<li><span>${text}</span><span class="pts">+${pts}</span></li>`)
    .join("");
  renderTable();
}

document.getElementById("search").addEventListener("input", renderTable);

// default to the highest-risk email
showDetail([...emails].sort((a, b) => b.score - a.score)[0]);
</script>

</body>
</html>
