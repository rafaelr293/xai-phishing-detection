<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIT Inbox Monitor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <h1><span class="dot dot-cyan"></span> KRIT <span class="muted">/ inbox monitor</span></h1>
</header>

<main class="container">

    <section class="level-container">
        <div class="level"><span class="dot dot-critical"></span>Critical<strong id="count-critical">0</strong></div>
        <div class="level"><span class="dot dot-high"></span>High<strong id="count-high">0</strong></div>
        <div class="level"><span class="dot dot-medium"></span>Medium<strong id="count-medium">0</strong></div>
        <div class="level"><span class="dot dot-low"></span>Low<strong id="count-low">0</strong></div>
    </section>

    <section class="toolbar">
        <input type="search" id="search" placeholder="Search sender or subject">
      <button type="button" class="btn btn-primary" id="scan-button">Scan inbox</button>
    </section>

    <div class="layout">

        <!-- LEFT: table + log -->
        <section class="list-col">
            <table class="email-table">
                <thead>
                    <tr>
                        <th>Score</th>
                        <th>From</th>
                        <th>Subject</th>
                        <th>Received</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="email-body"></tbody>
            </table>

        </section>

        <!-- RIGHT: detail panel -->
        <aside class="detail-panel">
            <div class="detail-header" id="detail-header">
                <div>
                    <span class="detail-label" id="d-label"></span>
                    <p class="detail-subject" id="d-subject"></p>
                    <span class="detail-sender" id="d-sender"></span>
                </div>
                <span class="detail-score" id="d-score"></span>
            </div>

            <h4 class="evidence-title" id="d-evidence-title"></h4>
            <ul class="evidence-list" id="d-evidence"></ul>

            <button class="btn btn-primary" id="view-email-button" type="button" disabled>View full email content</button>
            <button class="btn">Draft notification to recipient</button>
        </aside>

    </div>
</main>

  <div class="modal-backdrop" id="email-modal" hidden>
    <section class="email-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <div>
          <span class="detail-label">EMAIL CONTENT</span>
          <h2 id="modal-title"></h2>
        </div>
        <button class="modal-close" id="close-email-modal" type="button" aria-label="Close email content">×</button>
      </header>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="content-section">
        <h3>Plain-text body</h3>
        <pre id="modal-plain-text"></pre>
      </div>
      <div class="content-section">
        <h3>HTML source</h3>
        <pre id="modal-html-body"></pre>
      </div>
      <div class="content-section" id="modal-artifacts"></div>
    </section>
  </div>

<script>
const API_BASE = "http://localhost:8000";
const levelLabel = {
  critical: "CRITICAL RISK",
  high: "HIGH RISK",
  medium: "MEDIUM RISK",
  low: "LOW RISK",
  pending: "ANALYSIS PENDING"
};
const body = document.getElementById("email-body");
const search = document.getElementById("search");
const scanButton = document.getElementById("scan-button");
const viewEmailButton = document.getElementById("view-email-button");
const emailModal = document.getElementById("email-modal");
const closeEmailModal = document.getElementById("close-email-modal");
let emails = [];
let selectedId = null;
let selectedEmail = null;

function getLevel(email) {
  return email.level || "pending";
}

function getScore(email) {
  return email.score === null || email.score === undefined ? "—" : email.score;
}

function getTime(email) {
  if (!email.time) return "—";
  return new Date(email.time).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function setStatus(message) {
  scanButton.textContent = message;
}

function updateCounts() {
  ["critical", "high", "medium", "low"].forEach(level => {
    document.getElementById(`count-${level}`).textContent = emails.filter(email => getLevel(email) === level).length;
  });
}

function renderEmpty(message) {
  body.innerHTML = `<tr><td colspan="5" class="table-message">${message}</td></tr>`;
}

function renderTable() {
  const q = search.value.toLowerCase();
  const rows = emails
    .filter(e => (e.sender || "").toLowerCase().includes(q) || (e.subject || "").toLowerCase().includes(q))
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));

  if (!rows.length) {
    renderEmpty(q ? "No emails match this search." : "No emails have been ingested yet.");
    return;
  }

  body.innerHTML = "";
  rows.forEach(e => {
    const level = getLevel(e);
    const tr = document.createElement("tr");
    if (e.id === selectedId) tr.classList.add("selected");
    tr.innerHTML = `
      <td class="score score-${level}"><span class="dot dot-${level}"></span>${getScore(e)}</td>
      <td class="sender">${escapeHtml(e.sender || "Unknown sender")}</td>
      <td class="subject">${escapeHtml(e.subject || "(No subject)")}</td>
      <td class="time">${getTime(e)}</td>
      <td class="status">${e.status || "PENDING"}</td>`;
    tr.addEventListener("click", () => loadDetail(e));
    body.appendChild(tr);
  });
}

function showDetail(email) {
  const level = getLevel(email);
  selectedEmail = email;
  selectedId = email.id;
  viewEmailButton.disabled = !email.id;
  document.getElementById("detail-header").className = "detail-header " + level;
  document.getElementById("d-label").textContent = levelLabel[level];
  document.getElementById("d-subject").textContent = email.subject || "(No subject)";
  document.getElementById("d-sender").textContent = email.sender || "Unknown sender";
  document.getElementById("d-score").textContent = getScore(email);
  document.getElementById("d-evidence-title").textContent = `EVIDENCE (${(email.evidence || []).length})`;
  document.getElementById("d-evidence").innerHTML = (email.evidence || []).length
    ? email.evidence.map(indicator => `<li><span>${escapeHtml(indicator.description || indicator.type)}</span><span class="pts">${escapeHtml(indicator.severity || "")}</span></li>`).join("")
    : "<li><span>No detector evidence available yet.</span></li>";
  renderTable();
}

function renderEmailContent(email) {
  const headers = Object.entries(email.headers || {})
    .map(([name, value]) => `<dt>${escapeHtml(name)}</dt><dd>${escapeHtml(value)}</dd>`)
    .join("");
  const urls = (email.urls || []).map(url => `<li>${escapeHtml(url)}</li>`).join("");
  const attachments = (email.attachments || [])
    .map(attachment => `<li>${escapeHtml(attachment.filename)} <span class="pts">${escapeHtml(attachment.content_type)} · ${attachment.size_bytes} bytes</span></li>`)
    .join("");

  document.getElementById("modal-title").textContent = email.subject || "(No subject)";
  document.getElementById("modal-meta").innerHTML = `
    <dl class="header-list">${headers || "<dt>From</dt><dd>Unknown sender</dd>"}</dl>`;
  document.getElementById("modal-plain-text").textContent = email.plain_text || "No plain-text body.";
  document.getElementById("modal-html-body").textContent = email.html_body || "No HTML body.";
  document.getElementById("modal-artifacts").innerHTML = `
    <h3>URLs (${(email.urls || []).length})</h3>
    <ul class="artifact-list">${urls || "<li>None</li>"}</ul>
    <h3>Attachments (${(email.attachments || []).length})</h3>
    <ul class="artifact-list">${attachments || "<li>None</li>"}</ul>`;
}

function openEmailModal() {
  if (!selectedEmail || !selectedEmail.id) return;
  renderEmailContent(selectedEmail);
  emailModal.hidden = false;
  closeEmailModal.focus();
}

function closeEmailViewer() {
  emailModal.hidden = true;
  viewEmailButton.focus();
}

async function loadDetail(email) {
  showDetail(email);
  try {
    const response = await fetch(`${API_BASE}/api/emails/${email.id}`);
    if (!response.ok) throw new Error("Unable to load email details");
    showDetail(await response.json());
  } catch (error) {
    setStatus("API unavailable");
  }
}

async function loadEmails() {
  setStatus("Loading...");
  try {
    const response = await fetch(`${API_BASE}/api/emails`);
    if (!response.ok) throw new Error("Unable to load emails");
    const data = await response.json();
    emails = data.items || [];
    updateCounts();
    renderTable();
    if (emails.length) {
      const first = [...emails].sort((a, b) => (b.score ?? -1) - (a.score ?? -1))[0];
      await loadDetail(first);
    } else {
      showDetail({ id: null, subject: "No email selected", sender: "", evidence: [], status: "EMPTY" });
    }
    setStatus("Scan inbox");
  } catch (error) {
    renderEmpty("Unable to reach the analysis API.");
    setStatus("Retry scan");
  }
}

async function scanInbox() {
  setStatus("Scanning...");
  scanButton.disabled = true;
  try {
    const response = await fetch(`${API_BASE}/api/ingestion/scan`, { method: "POST" });
    if (!response.ok) throw new Error("Unable to scan inbox");
    await loadEmails();
  } catch (error) {
    setStatus("Retry scan");
  } finally {
    scanButton.disabled = false;
  }
}

search.addEventListener("input", renderTable);
scanButton.addEventListener("click", scanInbox);
viewEmailButton.addEventListener("click", openEmailModal);
closeEmailModal.addEventListener("click", closeEmailViewer);
emailModal.addEventListener("click", event => {
  if (event.target === emailModal) closeEmailViewer();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !emailModal.hidden) closeEmailViewer();
});

loadEmails();
</script>

</body>
</html>
