[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-phishing-detection-backend"
version = "0.1.0"
description = "Backend foundation for an explainable phishing detection platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.27,<1.0",
    "playwright==1.50.0",
]

[project.optional-dependencies]
browser = [
    "playwright==1.50.0",
]
test = [
    "pytest>=8.0,<9.0",
]
ml = [
    "joblib>=1.3,<2.0",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn==1.9.0",
    "lightgbm>=4.0,<5.0",
    "tldextract>=5.0,<6.0",
]
visual = [
    "matplotlib>=3.8,<4.0",
    "pillow>=10.0,<12.0",
    "pandas>=2.0,<3.0",
    "torch>=2.5,<3.0",
    "torchvision>=0.20,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
