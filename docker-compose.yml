services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: phishing
      POSTGRES_PASSWORD: phishing
      POSTGRES_DB: phishing_detection
    ports:
      - "5432:5432"
    volumes:
      - phishing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishing -d phishing_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://phishing:phishing@postgres:5432/phishing_detection
      INGESTION_DIRECTORY: /app/data/inbox
      ARTIFACT_DIRECTORY: /app/data/artifacts
      EMAIL_INFERENCE_DIRECTORY: /app/Tan Files
      ENABLE_EMAIL_NLP: "true"
      URL_INFERENCE_DIRECTORY: /app/Tan Files
      ENABLE_URL_RISK: "true"
      BROWSER_WORKER_URL: http://browser-worker:8010
      VISUAL_WORKER_URL: http://visual-worker:8010
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      browser-worker:
        condition: service_started
      visual-worker:
        condition: service_started

  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.browser
    environment:
      ARTIFACT_DIRECTORY: /app/data/artifacts
    expose:
      - "8010"
    volumes:
      - ./data:/app/data

  visual-worker:
    build:
      context: .
      dockerfile: "Visual Worker.Dockerfile"
    environment:
      ARTIFACT_DIRECTORY: /app/data/artifacts
      VISUAL_MODEL_PATH: /app/Tan Files/phish360_efficientnet_b0_best.pt
    expose:
      - "8010"
    volumes:
      - ./data:/app/data

volumes:
  phishing-postgres-data:
